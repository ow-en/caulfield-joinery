services:
  postgres:
    image: postgres:17

    container_name: caulfield-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: caulfield
      POSTGRES_PASSWORD: woodworking
      POSTGRES_DB: caulfield_joinery

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: